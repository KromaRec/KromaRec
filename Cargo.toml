[package]
name = "kromarec"
version = "0.10.3"
edition = "2024"
license = "MIT"

[dependencies]
argon2 = "0.5"
getrandom = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
base64 = "0.22"
form_urlencoded = "1"
hmac = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
multer = "3"
percent-encoding = "2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
